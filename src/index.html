<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HF Downloader</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><div class="logo">⬡</div><div><h1>HF Downloader</h1><p>Hugging Face modellerini ve dataset’lerini bilgisayarınıza indirin</p></div><span class="platform">Windows · Linux</span></header>
<section class="card"><h2>Bağlantı</h2><label>Hugging Face API token <span>(özel modeller için gerekli)</span></label><div class="token"><input id="token" type="password" placeholder="hf_••••••••••••••••"><button id="show">Göster</button></div><small>Token yalnızca bu uygulamada kullanılır ve sunucuya kaydedilmez.</small></section>
<section class="card"><h2>İndirilecek repository</h2><div class="row"><div class="grow"><label>Tür</label><select id="type"><option value="model">Model</option><option value="dataset">Dataset</option><option value="bucket">Bucket</option></select></div><div class="grow"><label>Repo ID veya Bucket URL</label><input id="repo" placeholder="kullanıcı/repo veya Hugging Face Bucket adresi"></div><button id="scan" class="secondary">Dosyaları getir</button></div><div id="files" class="filebox hidden"></div></section>
<section class="card"><h2>Kayıt konumu</h2><div class="row"><input id="target" readonly placeholder="Bir klasör seçin"><button id="pick" class="secondary">Klasör seç</button></div><button id="download" class="primary" disabled>İndirmeyi başlat</button><div id="status" class="status"></div><div class="bar"><i id="bar"></i></div></section>
<footer>Hugging Face Hub API · Açık kaynak masaüstü istemcisi<br><strong>Created by TAPSIN</strong></footer></main><script src="renderer.js"></script><script>hf.getToken().then(t=>{if(t){token.placeholder=t;status.textContent='API key hafızada saklanıyor.'}});token.addEventListener('change',async()=>{if(token.value.trim()){await hf.saveToken(token.value.trim());token.value='';token.placeholder='*** veri saklanıyor';status.textContent='API key güvenli hafızaya kaydedildi.'}});</script></body></html>
